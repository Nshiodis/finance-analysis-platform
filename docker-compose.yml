services:
  api:
    build: .
    image: finance-analysis:dev
    container_name: finance-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - finance-data:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  finance-data:
