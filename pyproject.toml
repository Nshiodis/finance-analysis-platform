[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "finance-analysis-platform"
version = "0.1.0"
description = "Financial data analysis platform"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pyright]
typeCheckingMode = "strict"
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=finance_analysis.services --cov=finance_analysis.repository --cov=finance_analysis.database --cov-report=term-missing"
